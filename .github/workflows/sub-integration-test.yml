name: Sub Integration Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  SINGBOX_VERSION: "1.13.3"
  SINGBOX_BUILD_TAGS: "with_gvisor with_quic with_dhcp with_wireguard with_utls with_acme with_clash_api with_tailscale with_ccm with_ocm with_v2ray_api"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: panel_backend/go.mod

      - name: Build sing-box
        run: |
          git clone --depth 1 --branch "v${SINGBOX_VERSION}" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          CGO_ENABLED=0 go build -trimpath -tags "${SINGBOX_BUILD_TAGS}" -o /tmp/sing-box/sing-box ./cmd/sing-box
          sudo cp /tmp/sing-box/sing-box /usr/local/bin/sing-box

      - name: Run sub integration tests
        env:
          API_URL: ${{ secrets.PANEL_API_URL }}
          CI_TOKEN: ${{ secrets.CI_API_TOKEN }}
        run: |
          cd panel_backend && go run cmd/sub-test/main.go
