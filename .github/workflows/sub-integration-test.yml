name: Sub Integration Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: panel_backend/go.mod

      - name: Install xray-core
        run: |
          bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install

      - name: Run sub integration tests
        env:
          API_URL: ${{ secrets.PANEL_API_URL }}
          CI_TOKEN: ${{ secrets.CI_API_TOKEN }}
        run: |
          cd panel_backend && go run cmd/sub-test/main.go
