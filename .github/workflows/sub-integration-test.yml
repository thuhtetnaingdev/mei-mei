name: Sub Integration Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  SINGBOX_VERSION: "1.13.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: panel_backend/go.mod

      - name: Download sing-box
        run: |
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          sudo cp "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box

      - name: Run sub integration tests
        env:
          API_URL: ${{ secrets.PANEL_API_URL }}
          CI_TOKEN: ${{ secrets.CI_API_TOKEN }}
        run: |
          cd panel_backend && go run cmd/sub-test/main.go
