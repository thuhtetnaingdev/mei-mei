name: Sub Integration Test

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: sub-integration-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: panel_backend/go.mod

      - name: Install xray-core
        run: |
          curl -L -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o /tmp/xray.zip -d /tmp/xray
          sudo mv /tmp/xray/xray /usr/local/bin/
          chmod +x /usr/local/bin/xray

      - name: Run sub integration tests
        env:
          API_URL: ${{ secrets.PANEL_API_URL }}
          CI_TOKEN: ${{ secrets.CI_API_TOKEN }}
        run: |
          ulimit -u 65536 2>/dev/null || true
          cd panel_backend && go run cmd/sub-test/main.go
